<ion-item>
  <ion-input
    [(ngModel)]="draft"
    [placeholder]="placeholder"
    (keyup.enter)="addFromDraft()"
    (ionBlur)="addFromDraft()"
  ></ion-input>
</ion-item>

@if (values.length > 0) {
  <ion-accordion-group value="current">
    <ion-accordion value="current">
      <ion-item slot="header">
        <ion-label>{{ listLabel }} ({{ values.length }})</ion-label>
      </ion-item>
      <div slot="content">
        @for (value of values; track $index; let i = $index) {
          <ion-item>
            <ion-label class="ion-text-wrap">{{ labelFn(value) }}</ion-label>
            <ion-button
              slot="end"
              fill="clear"
              color="danger"
              [attr.aria-label]="'Remove ' + labelFn(value)"
              (click)="confirmRemove(i)"
            >
              <ion-icon slot="icon-only" name="close"></ion-icon>
            </ion-button>
          </ion-item>
        }
      </div>
    </ion-accordion>
  </ion-accordion-group>
}

<ion-header>
  <ion-toolbar>
    <ion-title>Availability changes</ion-title>
    <ion-buttons slot="end">
      <ion-button aria-label="Close" (click)="dismiss()">
        <ion-icon slot="icon-only" name="close"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <app-availability-sections [sections]="sections"></app-availability-sections>
</ion-content>

<ion-footer>
  <ion-toolbar>
    <ion-button expand="block" (click)="dismiss()">OK</ion-button>
  </ion-toolbar>
</ion-footer>
